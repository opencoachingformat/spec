name: Release Spec

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    name: Publish @opencoachingformat/spec to npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI >=11.5.1. Node 22's bundled npm is
      # only 10.9.8 (verified against a real run's logs) — actions/setup-node
      # does NOT give us a new enough npm on its own, so upgrade explicitly.
      - name: Upgrade npm for OIDC trusted publishing support
        run: npm install -g npm@latest

      - name: Check tag matches package.json version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Authenticates via OIDC trusted publishing — no NPM_TOKEN needed.
      # Requires a trusted publisher already configured on the npm package
      # pointing at this repo + this workflow file, which in turn requires
      # the package to already exist (a one-time manual `npm publish`
      # bootstraps it). Provenance is automatic with trusted publishing, no
      # --provenance flag.
      - name: Publish to npm
        run: npm publish

  release:
    runs-on: ubuntu-latest
    name: Publish schema + docs site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build docs site (asciidoctor + astro)
        working-directory: site
        run: npm run build

      - name: Assemble dist/
        run: |
          mkdir -p dist
          cp -r site/dist/. dist/
          echo "opencoachingformat.org" > dist/CNAME

      - name: Publish versioned schema (Step A)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "dist/${VERSION}"
          cp schema/v1.json "dist/${VERSION}/ocf-action-v1.json"
          echo "Published schema/v1.json -> dist/${VERSION}/ocf-action-v1.json"

      - name: Deploy to gh-pages (Step C)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true

      - name: Notify ocf-validator (Step D)
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.OCF_VALIDATOR_DISPATCH_TOKEN }}
          repository: opencoachingformat/ocf-validator
          event-type: spec_released
          client-payload: '{"version": "${{ github.ref_name }}"}'
